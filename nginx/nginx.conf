upstream django {
    server web:8000;
}

# Map the Upgrade header so WebSocket connections proxy correctly: normal
# HTTP requests get "close"; WebSocket upgrades get "upgrade".
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    # Uploads go direct-to-MinIO, so request bodies here are small; keep a
    # sane ceiling for admin/JSON without allowing unbounded bodies.
    client_max_body_size 20M;

    # Nginx serves collected static directly from the shared volume.
    location /static/ {
        alias /app/staticfiles/;
        access_log off;
        expires 7d;
    }

    # WebSocket endpoint: needs the HTTP/1.1 upgrade dance.
    location /ws/ {
        proxy_pass http://django;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSockets are long-lived; don't let the proxy time them out early.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
